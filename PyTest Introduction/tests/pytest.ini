[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    validate_csv: Mark for tests that validate CSV structure and content
    unmarked: Mark automatically assigned to tests without explicit markers

addopts = -v --html=report.html --self-contained-html

# Report Portal integration 
rp_endpoint = https://reportportal.epam.com
rp_project = MELIKE_AY_PERSONAL
rp_api_key = REPLACE_WITH_API_KEY_AT_RUNTIME
rp_launch = Pytest_Intro_Homework
rp_launch_attributes = type:homework env:local
rp_log_batch_size = 20